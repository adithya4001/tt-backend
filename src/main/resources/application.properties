spring.application.name=table-and-thyme
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/table_thyme?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:tablethyme}
spring.datasource.password=${DB_PASSWORD:tablethyme_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Kolkata
server.error.include-message=never
app.gemini-key=${GEMINI_API_KEY:}
app.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
